<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@700&family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@400;500&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2e1d13; --bg2:#0f0805;
  --paper:#f2e5c7; --paper2:#e6d3a8;
  --ink:#3b2a1e; --red:#8a3324; --gold:#c9a15b; --cream:#f8f0dc;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at center,var(--bg1),var(--bg2) 75%) fixed;color:var(--cream);
  font-family:'Poppins',system-ui,sans-serif;overflow-x:hidden}
.scene{min-height:100vh;min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));text-align:center;position:relative;z-index:2}
.scene.active{display:flex}

/* slow round sprinkles */
.dust{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.dust i{position:absolute;bottom:-10px;border-radius:50%;background:var(--gold);opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.45}85%{opacity:.3}100%{transform:translateY(-108vh) translateX(30px);opacity:0}}

/* buttons */
.btn{font-family:'Poppins',sans-serif;font-weight:500;font-size:.95rem;color:var(--cream);background:rgba(20,10,5,.45);
  border:1px solid var(--gold);padding:13px 28px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .3s,transform .2s}
.btn:active{transform:scale(.96);background:rgba(201,161,91,.25)}
.btn.ghost{border-color:transparent;background:none;color:var(--gold);padding:10px 14px;font-size:.85rem}
.back{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:60;display:none;padding:8px 16px;font-size:.85rem}
.back.show{display:block}
.reveal{opacity:0;animation:fadeIn 2s ease forwards}
@keyframes fadeIn{to{opacity:1}}

/* INTRO: full-screen photo */
#intro{padding:0;justify-content:flex-end}
.hero{position:fixed;inset:0;z-index:0;overflow:hidden;background:#1a0f08}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block;
  filter:blur(34px) sepia(.7) brightness(.7);transform:scale(1.25);animation:heroClear 6s cubic-bezier(.25,.6,.2,1) .4s forwards}
@keyframes heroClear{to{filter:blur(0) sepia(.18) brightness(.85);transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,8,5,.35),transparent 30%,transparent 45%,rgba(15,8,5,.85))}
.intro-content{position:relative;z-index:2;padding:0 20px max(44px,env(safe-area-inset-bottom));width:100%}
.hb{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;color:var(--cream);font-size:clamp(2.4rem,11vw,5rem);line-height:1.1;
  filter:blur(24px);opacity:0;letter-spacing:.25em;transform:scale(1.1);animation:textClear 4.5s cubic-bezier(.2,.6,.2,1) 3s forwards;
  text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hb span{display:block;color:var(--gold);font-size:.7em;margin-top:.1em}
@keyframes textClear{to{filter:blur(0);opacity:1;letter-spacing:.03em;transform:scale(1)}}
#introBtn{margin-top:26px;animation-delay:7.5s}

/* LETTER (typewriter) */
.paper{position:relative;width:min(660px,94vw);max-height:calc(100vh - 200px);max-height:calc(100dvh - 200px);overflow-y:auto;padding:clamp(22px,5vw,46px);text-align:left;margin-top:34px;
  font-family:'Special Elite','Courier New',monospace;
  background:radial-gradient(ellipse at 20% 10%,var(--paper),var(--paper2));color:var(--ink);border-radius:5px;
  box-shadow:0 25px 70px rgba(0,0,0,.7),inset 0 0 60px rgba(139,94,40,.25);transform-origin:center;
  animation:unfold 1.8s cubic-bezier(.2,.7,.2,1) both;scrollbar-width:thin}
@keyframes unfold{from{transform:scale(.4) translateY(30vh);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
.addr{font-size:.7rem;line-height:1.5;letter-spacing:.04em;text-transform:uppercase;max-width:52%}
.stamp{position:absolute;top:18px;right:18px;width:56px;height:68px;background:#f9efd8;border:3px dotted #b7873f;transform:rotate(4deg);
  display:grid;place-items:center;color:var(--red);font-size:1.4rem;text-align:center;line-height:1}
.stamp small{display:block;font-size:.45rem;letter-spacing:.1em;margin-top:3px}
.postmark{position:absolute;top:14px;right:54px;width:72px;height:72px;border:2px solid rgba(138,51,36,.55);border-radius:50%;transform:rotate(-14deg);
  display:grid;place-items:center;font-size:.45rem;color:rgba(138,51,36,.75);letter-spacing:.1em;text-align:center;line-height:1.5}
.rs{position:absolute;top:92px;right:14px;border:2px solid rgba(138,51,36,.7);color:rgba(138,51,36,.8);padding:2px 7px;font-size:.52rem;letter-spacing:.12em;transform:rotate(-7deg);text-transform:uppercase}
.lip{position:absolute;opacity:.18;filter:sepia(1) saturate(1.8) hue-rotate(-15deg);pointer-events:none}
.title{font-size:clamp(1.4rem,6vw,1.9rem);color:var(--red);margin:48px 0 4px;text-align:center;letter-spacing:.06em;text-transform:uppercase}
.tag{text-align:center;font-size:.78rem;color:#7a5a38;margin-bottom:22px;border-top:1px solid rgba(122,90,56,.4);padding-top:8px;width:60%;margin-left:auto;margin-right:auto}
#typed{white-space:pre-wrap;font-size:clamp(.95rem,3.6vw,1.15rem);line-height:1.8;position:relative}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:text-bottom;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ctrl{margin-top:16px;display:flex;gap:10px;align-items:center;justify-content:center;min-height:50px}

/* MEMORIES */
#memories{justify-content:flex-start;padding-top:80px;padding-bottom:110px}
#memories h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:clamp(2.2rem,9vw,3.6rem);color:var(--cream);filter:blur(14px);opacity:0;transition:all 3s ease}
#memories h2.in{filter:blur(0);opacity:1}
.sub{color:var(--gold);margin:8px 0 46px;font-size:.9rem}
.wall{display:flex;flex-wrap:wrap;gap:44px 30px;justify-content:center;max-width:1000px;margin:auto}
.polaroid{width:min(270px,80vw);background:var(--cream);padding:12px 12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.65);
  transform:rotate(var(--r)) translateY(40px);opacity:0;transition:transform 1.6s ease,opacity 1.6s ease;color:var(--ink)}
.polaroid.in{transform:rotate(var(--r));opacity:1}
.ph{aspect-ratio:4/5;background:#4a3523;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(22px) sepia(.9) brightness(.6);transform:scale(1.2)}
.polaroid.in .ph img{animation:develop 4.5s ease .5s forwards}
@keyframes develop{to{filter:blur(0) sepia(.25) contrast(1.04);transform:scale(1)}}
.cap{font-family:'Caveat',cursive;font-size:1.5rem;margin-top:10px;line-height:1.15}
.more{margin-top:70px}

/* INVITATION */
#invite{padding-top:70px;padding-bottom:60px}
.env{position:relative;width:min(400px,94vw);padding:26px 22px 120px;background:#5c1526;border-radius:6px;box-shadow:0 25px 60px rgba(0,0,0,.7);overflow:hidden}
.env::before,.env::after{content:"";position:absolute;bottom:0;width:50%;height:30%;background:#6e1b2f;z-index:3}
.env::before{left:0;clip-path:polygon(0 0,100% 100%,0 100%)}
.env::after{right:0;clip-path:polygon(100% 0,0 100%,100% 100%)}
.card{position:relative;background:#f4ecd8;color:#6b1d2a;padding:34px 18px 100px;border:9px dotted #fbf3e2;background-clip:padding-box;
  clip-path:polygon(0 0,100% 0,100% 90%,50% 100%,0 90%);animation:rise 3s cubic-bezier(.2,.7,.2,1) both;font-family:'Cormorant Garamond',serif}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.card .script{font-family:'Great Vibes',cursive;font-weight:400}
.inv-title{font-size:clamp(2.4rem,11vw,3.2rem);line-height:1.1}
.join{font-size:.78rem;letter-spacing:.2em;margin-top:22px;font-weight:600}
.bday{font-size:clamp(2rem,9vw,2.6rem);letter-spacing:.14em;font-weight:600;line-height:1.15}
.of{font-size:.8rem;letter-spacing:.2em;margin:2px 0}
.inv-name{font-size:clamp(2.4rem,11vw,3.2rem);line-height:1.1}
.nick{font-style:italic;font-size:1rem;margin-top:-2px}
.orn{margin:12px auto;width:70%;border-top:1px solid #6b1d2a;position:relative;height:0}
.orn::after{content:"❦";position:absolute;left:50%;top:-.75em;transform:translateX(-50%);background:#f4ecd8;padding:0 8px;font-size:1rem}
.lbl{font-size:.82rem;letter-spacing:.25em;margin-top:14px;font-weight:600}
.val{font-size:1.15rem;font-weight:600;line-height:1.3}
.val small{display:block;font-size:.95rem;font-weight:500;font-style:italic}
.msg{font-style:italic;font-size:1.02rem;line-height:1.35;margin:18px 6px 0}
.seal{position:absolute;left:50%;bottom:72px;width:84px;height:84px;margin-left:-42px;z-index:6;border-radius:48% 52% 50% 50%/52% 48% 52% 48%;
  background:radial-gradient(circle at 35% 30%,#e6c26e,#a9772a 70%,#7e5519);box-shadow:0 5px 14px rgba(0,0,0,.6),inset 0 0 0 5px rgba(255,235,170,.2);
  display:grid;place-items:center;font-family:'Great Vibes',cursive;font-size:2.6rem;color:#6a4515;text-shadow:0 1px 0 rgba(255,235,170,.5)}
.stagger>*{opacity:0;animation:fadeIn 1.6s ease forwards;animation-delay:calc(var(--i)*.35s + 1.2s)}
</style>
</head>
<body>

<div class="dust" id="dust"></div>
<button class="btn back" id="backBtn">‹ Back</button>

<!-- 1. INTRO -->
<section class="scene active" id="intro">
  <div class="hero"><img id="heroImg" alt=""></div>
  <div class="intro-content">
    <h1 class="hb">Happy Birthday<span id="nameBig"></span></h1>
    <button class="btn reveal" id="introBtn">Open your letter</button>
  </div>
</section>

<!-- 2. LETTER -->
<section class="scene" id="letterScene">
  <div class="paper" id="paper">
    <span class="lip" style="left:6%;bottom:8%;transform:rotate(-20deg);font-size:3rem">💋</span>
    <span class="lip" style="right:8%;top:45%;transform:rotate(15deg);font-size:2.2rem">💋</span>
    <div class="postmark">BIRTHDAY<br>POST OFFICE<br>★ 2026 ★</div>
    <div class="stamp"><div>♥<small>FOR YOU</small></div></div>
    <div class="rs">delivered with love</div>
    <div class="addr">From:<br><b id="Fromtxt"></b><br>To:<br><b id="toTxt"></b></div>
    <div class="title">A Letter For You</div>
    <div class="tag">words from my heart</div>
    <span id="typed"></span><span class="cursor" id="cursor"></span>
  </div>
  <div class="ctrl">
    <button class="btn ghost" id="skip">Skip typing ›</button>
    <button class="btn" id="nextBtn" style="display:none">Our memories ↓</button>
  </div>
</section>

<!-- 3. MEMORIES -->
<section class="scene" id="memories">
  <h2 id="memTitle">Our Memories</h2>
  <p class="sub">little moments that mean the world</p>
  <div class="wall" id="wall"></div>
  <button class="btn more" id="moreBtn">One more thing… ✉</button>
</section>

<!-- 4. INVITATION -->
<section class="scene" id="invite">
  <div class="env">
    <div class="card stagger" id="card">
      <div class="script inv-title" style="--i:0">You're Invited</div>
      <div class="join" style="--i:1">JOIN ME TO CELEBRATE THE</div>
      <div class="bday" style="--i:1">BIRTHDAY</div>
      <div class="of" style="--i:2">— OF —</div>
      <div class="script inv-name" id="invName" style="--i:2"></div>
      <div class="nick" id="invNick" style="--i:2"></div>
      <div class="orn" style="--i:3"></div>
      <div style="--i:4"><div class="lbl">❀ DATE</div><div class="val" id="invDate"></div></div>
      <div id="timeBlock" style="--i:4;display:none"><div class="lbl">❀ TIME</div><div class="val" id="invTime"></div></div>
      <div style="--i:5"><div class="lbl">❀ VENUE</div><div class="val" id="invVenue"></div></div>
      <div class="msg" id="invMsg" style="--i:6"></div>
    </div>
    <div class="seal" id="seal"></div>
  </div>
</section>

Remember how you mentioned once or twice that I make websites for everyone else, but never make one for you? Well, here it is. Took me long enough, didn’t it? xD

It’s your birthday, and I honestly can’t believe it’s been 10 years of us. TEN YEARS. An entire decade of knowing each other, growing up together, making memories, and being a part of each other’s lives.

Sometimes I think about how much time has passed. We’ve come a long way from those little kids we used to be, and so much has changed along the way. We’ve had our own phases, our own chaos, countless laughs, and memories that I’ll always carry with me. I don’t think I could ever put all of it into words perfectly.

It’s funny how some people become a permanent part of your life without you even realising when it happened. You’re one of those people for me. I know we don’t spend as much time together as we used to, and life has gotten pretty busy, but I hope you know that time or distance will never make you any less important to me.

I’m genuinely grateful that I got to grow up with you and share so many parts of life together. I hope life gives you everything you deserve — all the happiness, opportunities, love, and a thousand reasons to smile.

Keep being exactly who you are, keep doing your thing, and never settle for anything less than what makes you happy.

Here’s to 10 years of friendship, and hopefully a lifetime more of it.

And yes, you can finally stop complaining about the website. You officially have one now. 😭

Happy Birthday once again, Dhruvi. Love you loads! 🤍

Always yours,
${FROM}`;

const TYPE_SPEED = 55;   // ms per letter (bada number = slow typing)
/* ============================================ */

const $ = id => document.getElementById(id);
$("nameBig").textContent = NAME;
$("Fromtxt").textContent = FROM;
$("toTxt").textContent = NAME;
$("invName").textContent = NAME;
$("invNick").textContent = "(aka " + NICK + ")";
$("invDate").textContent = DATE_TXT;
$("invMsg").textContent = INVITE_MSG;
$("seal").textContent = NAME[0];
const v=$("invVenue"); v.textContent=VENUE;
if(VENUE_SUB){const s=document.createElement("small");s.textContent=VENUE_SUB;v.appendChild(s);}
if(TIME_TXT){$("timeBlock").style.display="";$("invTime").textContent=TIME_TXT;}

// slow round sprinkles
for(let i=0;i<22;i++){
  const d=document.createElement("i");
  const s=2+Math.random()*3;
  d.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${24+Math.random()*22}s;animation-delay:${-Math.random()*30}s`;
  $("dust").appendChild(d);
}

// full-screen intro photo
$("heroImg").src=PHOTOS[0];

let current="intro";
function show(id){
  document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active"); current=id;
  window.scrollTo(0,0);
  $("backBtn").classList.toggle("show",id!=="intro");
}

// letter
let typing=false, timer, finished=false;
$("introBtn").onclick=()=>{
  // const b=$("bgm"); if(b) b.play();   // music ke liye uncomment
  show("letterScene");
  if(!finished) startTyping();
};
function startTyping(){
  clearTimeout(timer); typing=true; finished=false;
  const out=$("typed"), paper=$("paper");
  out.textContent=""; $("cursor").style.display="";
  $("skip").style.display=""; $("nextBtn").style.display="none";
  paper.style.animation="none"; void paper.offsetWidth; paper.style.animation="";
  let i=0;
  (function step(){
    if(!typing) return;
    if(i>=LETTER.length) return finish();
    const ch=LETTER[i++];
    out.textContent+=ch;
    paper.scrollTop=paper.scrollHeight;
    let d=TYPE_SPEED+Math.random()*40;
    if(".,!?".includes(ch)) d+=260;
    if(ch==="\n") d+=420;
    timer=setTimeout(step,d);
  })();
}
function finish(){
  typing=false; finished=true; clearTimeout(timer);
  $("typed").textContent=LETTER;
  $("cursor").style.display="none"; $("skip").style.display="none";
  $("nextBtn").style.display="inline-block";
}
$("skip").onclick=finish;

// memories
MEMORIES.forEach((m,i)=>{
  const p=document.createElement("div");
  p.className="polaroid";
  p.style.setProperty("--r",((i%2?1:-1)*(1+Math.random()*3.5)).toFixed(1)+"deg");
  p.innerHTML=`<div class="ph"><img src="${PHOTOS[m.img]}" style="object-position:${m.pos}" alt=""></div><p class="cap">${m.cap}</p>`;
  $("wall").appendChild(p);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
}),{threshold:.2});
let memsSeen=false;
$("nextBtn").onclick=()=>{
  show("memories");
  if(!memsSeen){
    memsSeen=true;
    setTimeout(()=>$("memTitle").classList.add("in"),400);
    document.querySelectorAll(".polaroid").forEach(p=>io.observe(p));
  }
};

// invitation
let invSeen=false;
$("moreBtn").onclick=()=>{
  show("invite");
  if(!invSeen) invSeen=true;
  else { const c=$("card"); c.style.animation="none"; void c.offsetWidth; c.style.animation=""; }
};

// back
$("backBtn").onclick=()=>{
  if(current==="invite") show("memories");
  else if(current==="memories") show("letterScene");
  else if(current==="letterScene"){
    if(!finished){typing=false;clearTimeout(timer);}
    show("intro");
  }
};
</script>
</body>
</html>
